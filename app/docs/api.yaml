openapi: 3.0.3
info:
  title: Evora Engine API
  version: 1.0.0
  description: Backend API for the Evora engine platform.
paths:
  /api/me:
    get:
      operationId: me_retrieve
      description: Returns the profile of the authenticated user.
      summary: Get current user
      tags:
      - me
      security:
      - supabase: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - supabase: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/user/{id}:
    get:
      operationId: user_retrieve
      description: Returns a user record. Only the authenticated user can access their
        own record.
      summary: Get user by ID
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - user
      security:
      - supabase: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
    patch:
      operationId: user_partial_update
      description: Updates the authenticated user's name and mobile_number.
      summary: Update current user
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
      security:
      - supabase: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
  /api/organization:
    post:
      operationId: organization_create
      description: Creates a new organization.
      summary: Create organization
      tags:
      - organization
      security:
      - supabase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: Organization created
        '400':
          description: Validation error
        '401':
          description: No JWT or invalid JWT
  /api/organization/{id}:
    get:
      operationId: organization_retrieve
      description: Returns an organization by its ID.
      summary: Get organization by ID
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organization
      security:
      - supabase: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        '401':
          description: No JWT or invalid JWT
        '404':
          description: Not found
    patch:
      operationId: organization_partial_update
      description: Partially updates an organization.
      summary: Update organization
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organization
      security:
      - supabase: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        '400':
          description: Validation error
        '401':
          description: No JWT or invalid JWT
        '404':
          description: Not found
  /api/vehicle:
    get:
      operationId: vehicle_list
      description: Returns all vehicles belonging to the authenticated user's organization.
      summary: List vehicles
      tags:
      - vehicle
      security:
      - supabase: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
          description: ''
        '401':
          description: No JWT or invalid JWT
        '403':
          description: User not associated with any organization
    post:
      operationId: vehicle_create
      description: Creates a new vehicle under the authenticated user's organization.
      summary: Create vehicle
      tags:
      - vehicle
      security:
      - supabase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VehicleCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VehicleCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
          description: Vehicle created
        '400':
          description: Validation error
        '401':
          description: No JWT or invalid JWT
        '403':
          description: User not associated with any organization
  /api/vehicle/{id}:
    get:
      operationId: vehicle_retrieve
      description: Returns a vehicle by its ID (scoped to user's organization).
      summary: Get vehicle by ID
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - vehicle
      security:
      - supabase: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
          description: ''
        '401':
          description: No JWT or invalid JWT
        '403':
          description: User not associated with any organization
        '404':
          description: Not found
    patch:
      operationId: vehicle_partial_update
      description: Partially updates a vehicle (scoped to user's organization).
      summary: Update vehicle
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - vehicle
      security:
      - supabase: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVehicleUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVehicleUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVehicleUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
          description: ''
        '400':
          description: Validation error
        '401':
          description: No JWT or invalid JWT
        '403':
          description: User not associated with any organization
        '404':
          description: Not found
    delete:
      operationId: vehicle_destroy
      description: Deletes a vehicle (scoped to user's organization).
      summary: Delete vehicle
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - vehicle
      security:
      - supabase: []
      responses:
        '204':
          description: No content
        '401':
          description: No JWT or invalid JWT
        '403':
          description: User not associated with any organization
        '404':
          description: Not found
  /api/vehicles/bulk-upload:
    post:
      operationId: vehicle_bulk_upload
      description: Upload a CSV or Excel file containing vehicle records. The file is processed asynchronously.
      summary: Bulk upload vehicles
      tags:
      - vehicle
      security:
      - supabase: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV (.csv) or Excel (.xlsx, .xls) file
              required:
              - file
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpload'
          description: Upload accepted
        '400':
          description: Validation error
        '401':
          description: No JWT or invalid JWT
        '403':
          description: User not associated with any organization
  /api/vehicles/bulk-upload/{upload_id}:
    get:
      operationId: vehicle_bulk_upload_status
      description: Returns the status, progress, and error report for a bulk upload.
      summary: Get bulk upload status
      parameters:
      - in: path
        name: upload_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - vehicle
      security:
      - supabase: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpload'
          description: ''
        '401':
          description: No JWT or invalid JWT
        '403':
          description: User not associated with any organization
        '404':
          description: Not found
components:
  schemas:
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        industry:
          type: string
          maxLength: 255
        headquarters_address:
          type: string
        headquarters_location:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
              description: '[longitude, latitude]'
          description: GeoJSON Point (SRID 4326)
        operating_states:
          type: array
          items:
            type: string
            maxLength: 100
        operating_cities:
          type: array
          items:
            type: string
            maxLength: 255
        gst_number:
          type: string
          maxLength: 50
        website:
          type: string
          format: uri
          maxLength: 500
        logo_url:
          type: string
          format: uri
          maxLength: 500
        timezone:
          type: string
          maxLength: 100
        currency:
          type: string
          maxLength: 10
        business_hours:
          type: object
        data_quality_score:
          type: number
          format: double
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    OrganizationCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 255
        industry:
          type: string
          maxLength: 255
        headquarters_address:
          type: string
        headquarters_location:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
        operating_states:
          type: array
          items:
            type: string
        operating_cities:
          type: array
          items:
            type: string
        gst_number:
          type: string
          maxLength: 50
        website:
          type: string
          format: uri
          maxLength: 500
        logo_url:
          type: string
          format: uri
          maxLength: 500
        timezone:
          type: string
          maxLength: 100
        currency:
          type: string
          maxLength: 10
        business_hours:
          type: object
        data_quality_score:
          type: number
          format: double
          nullable: true
    PatchedOrganizationUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        industry:
          type: string
          maxLength: 255
        headquarters_address:
          type: string
        headquarters_location:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
        operating_states:
          type: array
          items:
            type: string
        operating_cities:
          type: array
          items:
            type: string
        gst_number:
          type: string
          maxLength: 50
        website:
          type: string
          format: uri
          maxLength: 500
        logo_url:
          type: string
          format: uri
          maxLength: 500
        timezone:
          type: string
          maxLength: 100
        currency:
          type: string
          maxLength: 10
        business_hours:
          type: object
        data_quality_score:
          type: number
          format: double
          nullable: true
    PatchedUserUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        mobile_number:
          type: string
          maxLength: 20
    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization_id:
          type: string
          format: uuid
          readOnly: true
        registration_number:
          type: string
          maxLength: 100
        vin:
          type: string
          maxLength: 100
        chassis_number:
          type: string
          maxLength: 100
        manufacturer:
          type: string
          maxLength: 255
        model:
          type: string
          maxLength: 255
        variant:
          type: string
          maxLength: 255
        manufacture_year:
          type: integer
        purchase_date:
          type: string
          format: date
        vehicle_type:
          $ref: '#/components/schemas/VehicleTypeEnum'
        fuel_type:
          $ref: '#/components/schemas/FuelTypeEnum'
        engine_cc:
          type: integer
          nullable: true
        fuel_tank_capacity:
          type: number
          format: double
          nullable: true
        battery_capacity_kwh:
          type: number
          format: double
          nullable: true
        mileage_kmpl:
          type: number
          format: double
        payload_kg:
          type: number
          format: double
        seating_capacity:
          type: integer
        gvw_kg:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/VehicleStatusEnum'
        current_location:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
              description: '[longitude, latitude]'
          description: GeoJSON Point (SRID 4326)
        assigned_driver_id:
          type: string
          format: uuid
          nullable: true
        odometer_km:
          type: number
          format: double
        avg_daily_km:
          type: number
          format: double
        avg_monthly_km:
          type: number
          format: double
        trips_per_day:
          type: number
          format: double
        fuel_cost_per_month:
          type: number
          format: double
        maintenance_cost_per_month:
          type: number
          format: double
        insurance_expiry:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - registration_number
      - manufacturer
      - model
      - manufacture_year
      - purchase_date
      - vehicle_type
      - fuel_type
      - mileage_kmpl
      - payload_kg
      - seating_capacity
      - gvw_kg
      - odometer_km
      - avg_daily_km
      - avg_monthly_km
      - trips_per_day
      - fuel_cost_per_month
      - maintenance_cost_per_month
      - insurance_expiry
    VehicleCreate:
      type: object
      required:
      - registration_number
      - manufacturer
      - model
      - manufacture_year
      - purchase_date
      - vehicle_type
      - fuel_type
      - mileage_kmpl
      - payload_kg
      - seating_capacity
      - gvw_kg
      - odometer_km
      - avg_daily_km
      - avg_monthly_km
      - trips_per_day
      - fuel_cost_per_month
      - maintenance_cost_per_month
      - insurance_expiry
      properties:
        registration_number:
          type: string
          maxLength: 100
        vin:
          type: string
          maxLength: 100
        chassis_number:
          type: string
          maxLength: 100
        manufacturer:
          type: string
          maxLength: 255
        model:
          type: string
          maxLength: 255
        variant:
          type: string
          maxLength: 255
        manufacture_year:
          type: integer
        purchase_date:
          type: string
          format: date
        vehicle_type:
          $ref: '#/components/schemas/VehicleTypeEnum'
        fuel_type:
          $ref: '#/components/schemas/FuelTypeEnum'
        engine_cc:
          type: integer
          nullable: true
        fuel_tank_capacity:
          type: number
          format: double
          nullable: true
        battery_capacity_kwh:
          type: number
          format: double
          nullable: true
        mileage_kmpl:
          type: number
          format: double
        payload_kg:
          type: number
          format: double
        seating_capacity:
          type: integer
        gvw_kg:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/VehicleStatusEnum'
        current_location:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
        assigned_driver_id:
          type: string
          format: uuid
          nullable: true
        odometer_km:
          type: number
          format: double
        avg_daily_km:
          type: number
          format: double
        avg_monthly_km:
          type: number
          format: double
        trips_per_day:
          type: number
          format: double
        fuel_cost_per_month:
          type: number
          format: double
        maintenance_cost_per_month:
          type: number
          format: double
        insurance_expiry:
          type: string
          format: date
    PatchedVehicleUpdate:
      type: object
      properties:
        registration_number:
          type: string
          maxLength: 100
        vin:
          type: string
          maxLength: 100
        chassis_number:
          type: string
          maxLength: 100
        manufacturer:
          type: string
          maxLength: 255
        model:
          type: string
          maxLength: 255
        variant:
          type: string
          maxLength: 255
        manufacture_year:
          type: integer
        purchase_date:
          type: string
          format: date
        vehicle_type:
          $ref: '#/components/schemas/VehicleTypeEnum'
        fuel_type:
          $ref: '#/components/schemas/FuelTypeEnum'
        engine_cc:
          type: integer
          nullable: true
        fuel_tank_capacity:
          type: number
          format: double
          nullable: true
        battery_capacity_kwh:
          type: number
          format: double
          nullable: true
        mileage_kmpl:
          type: number
          format: double
        payload_kg:
          type: number
          format: double
        seating_capacity:
          type: integer
        gvw_kg:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/VehicleStatusEnum'
        current_location:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
        assigned_driver_id:
          type: string
          format: uuid
          nullable: true
        odometer_km:
          type: number
          format: double
        avg_daily_km:
          type: number
          format: double
        avg_monthly_km:
          type: number
          format: double
        trips_per_day:
          type: number
          format: double
        fuel_cost_per_month:
          type: number
          format: double
        maintenance_cost_per_month:
          type: number
          format: double
        insurance_expiry:
          type: string
          format: date
    VehicleTypeEnum:
      enum:
      - bus
      - truck
      - car
      - van
      - trailer
      - other
      type: string
      description: |-
        * `bus` - Bus
        * `truck` - Truck
        * `car` - Car
        * `van` - Van
        * `trailer` - Trailer
        * `other` - Other
    FuelTypeEnum:
      enum:
      - diesel
      - petrol
      - ev
      - cng
      - lpg
      - other
      type: string
      description: |-
        * `diesel` - Diesel
        * `petrol` - Petrol
        * `ev` - EV
        * `cng` - CNG
        * `lpg` - LPG
        * `other` - Other
    VehicleStatusEnum:
      enum:
      - active
      - inactive
      - under_maintenance
      - retired
      - sold
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `under_maintenance` - Under Maintenance
        * `retired` - Retired
        * `sold` - Sold
    BulkUpload:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        file:
          type: string
          format: uri
          readOnly: true
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
        total_rows:
          type: integer
          readOnly: true
        processed_rows:
          type: integer
          readOnly: true
        failed_rows:
          type: integer
          readOnly: true
        error_report:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              errors:
                type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
