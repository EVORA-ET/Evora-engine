openapi: 3.0.3
info:
  title: Evora Engine API
  version: 1.0.0
  description: Backend API for the Evora engine platform.
paths:
  /api/me:
    get:
      operationId: me_retrieve
      description: Returns the profile of the authenticated user.
      summary: Get current user
      tags:
      - me
      security:
      - supabase: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - supabase: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/user/{id}:
    get:
      operationId: user_retrieve
      description: Returns a user record. Only the authenticated user can access their
        own record.
      summary: Get user by ID
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - user
      security:
      - supabase: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
    patch:
      operationId: user_partial_update
      description: Updates the authenticated user's name and mobile_number.
      summary: Update current user
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
      security:
      - supabase: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
  /api/organization:
    post:
      operationId: organization_create
      description: Creates a new organization.
      summary: Create organization
      tags:
      - organization
      security:
      - supabase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: Organization created
        '400':
          description: Validation error
        '401':
          description: No JWT or invalid JWT
  /api/organization/{id}:
    get:
      operationId: organization_retrieve
      description: Returns an organization by its ID.
      summary: Get organization by ID
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organization
      security:
      - supabase: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        '401':
          description: No JWT or invalid JWT
        '404':
          description: Not found
    patch:
      operationId: organization_partial_update
      description: Partially updates an organization.
      summary: Update organization
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organization
      security:
      - supabase: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        '400':
          description: Validation error
        '401':
          description: No JWT or invalid JWT
        '404':
          description: Not found
components:
  schemas:
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        industry:
          type: string
          maxLength: 255
        headquarters_address:
          type: string
        headquarters_location:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
              description: '[longitude, latitude]'
          description: GeoJSON Point (SRID 4326)
        operating_states:
          type: array
          items:
            type: string
            maxLength: 100
        operating_cities:
          type: array
          items:
            type: string
            maxLength: 255
        gst_number:
          type: string
          maxLength: 50
        website:
          type: string
          format: uri
          maxLength: 500
        logo_url:
          type: string
          format: uri
          maxLength: 500
        timezone:
          type: string
          maxLength: 100
        currency:
          type: string
          maxLength: 10
        business_hours:
          type: object
        data_quality_score:
          type: number
          format: double
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    OrganizationCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 255
        industry:
          type: string
          maxLength: 255
        headquarters_address:
          type: string
        headquarters_location:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
        operating_states:
          type: array
          items:
            type: string
        operating_cities:
          type: array
          items:
            type: string
        gst_number:
          type: string
          maxLength: 50
        website:
          type: string
          format: uri
          maxLength: 500
        logo_url:
          type: string
          format: uri
          maxLength: 500
        timezone:
          type: string
          maxLength: 100
        currency:
          type: string
          maxLength: 10
        business_hours:
          type: object
        data_quality_score:
          type: number
          format: double
          nullable: true
    PatchedOrganizationUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        industry:
          type: string
          maxLength: 255
        headquarters_address:
          type: string
        headquarters_location:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
        operating_states:
          type: array
          items:
            type: string
        operating_cities:
          type: array
          items:
            type: string
        gst_number:
          type: string
          maxLength: 50
        website:
          type: string
          format: uri
          maxLength: 500
        logo_url:
          type: string
          format: uri
          maxLength: 500
        timezone:
          type: string
          maxLength: 100
        currency:
          type: string
          maxLength: 10
        business_hours:
          type: object
        data_quality_score:
          type: number
          format: double
          nullable: true
    PatchedUserUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        mobile_number:
          type: string
          maxLength: 20
    StatusEnum:
      enum:
      - active
      - inactive
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          readOnly: true
        mobile_number:
          type: string
          maxLength: 20
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - name
      - updated_at
  securitySchemes:
    supabase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT authentication. Obtain a token by signing in via the
        Supabase client.
